name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          # Disable caching in release flows to avoid cache poisoning supply chain attacks
          no-cache: true

      - name: Check the tag names the package version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Pack
        run: bun pm pack --destination out

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/*.tgz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: gh release create "$GITHUB_REF_NAME" out/*.tgz --verify-tag --generate-notes --prerelease="$PRERELEASE"
